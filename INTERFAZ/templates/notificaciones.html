{% extends "base.html" %}

{% block title %}Notificaciones de Stock Bajo{% endblock %}

{% block content %}
<div class="dropdown-tab">
  <button type="button" class="dropdown-toggle" onclick="toggleDropdown()">
    Destinatarios de alertas de stock ▾
  </button>

  <div id="dropdown-panel" class="dropdown-panel" style="display:none;">
    {% for d in destinatarios %}
      <form method="POST" action="{{ url_for('notificaciones.toggle_notificacion', id=d.id) }}"
            class="dropdown-item">
        <label>
          <input type="checkbox" onchange="this.form.submit()" {{ 'checked' if d.activo else '' }}>
          {{ d.email }} {% if d.nombre %}({{ d.nombre }}){% endif %}
        </label>
        <button type="submit" formaction="{{ url_for('notificaciones.eliminar_notificacion', id=d.id) }}"
                class="btn-eliminar" onclick="return confirm('¿Eliminar {{ d.email }}?')">✕</button>
      </form>
    {% endfor %}

    <form method="POST" action="{{ url_for('notificaciones.agregar_notificacion') }}" class="dropdown-add">
      <input type="email" name="email" placeholder="nuevo@mail.com" required>
      <input type="text" name="nombre" placeholder="Nombre (opcional)">
      <button type="submit">Agregar</button>
    </form>
  </div>
</div>

<script>
function toggleDropdown() {
  const panel = document.getElementById('dropdown-panel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
</script>
{% endblock %}
