{% extends "base.html" %}

{% block title %}Login - DML ST{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center flex-grow-1 py-4">
  <div class="col-md-5">
    <div class="card shadow-lg border-0">
      <div class="card-header bg-primary text-white text-center py-4">
        <span class="login-logo-badge">
          <img src="{{ url_for('static', filename='logo.png') }}" alt="DML Logo" class="login-logo-img">
        </span>
        <h2 class="mb-0 mt-3">DML Servicios Técnicos</h2>
        <small>Sistema de Gestión ST & Repuestos</small>
      </div>
      <div class="card-body p-5">
        <form method="POST">
          <div class="mb-4">
            <label for="email" class="form-label"><i class="bi bi-envelope"></i> Email</label>
            <input type="email" class="form-control form-control-lg" id="email" name="email" 
                   placeholder="tu@email.com" required autofocus>
          </div>
          
          <div class="mb-4">
            <label for="password" class="form-label"><i class="bi bi-lock"></i> Contraseña</label>
            {# #189: ojito para mostrar/ocultar la contraseña. #}
            <div class="password-wrapper">
              <input type="password" class="form-control form-control-lg" id="password" name="password"
                     placeholder="Ingresa tu contraseña" required>
              <button type="button" class="password-toggle" id="toggle-password"
                      aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100">
            Ingresar al Sistema
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('toggle-password').addEventListener('click', function () {
    const input = document.getElementById('password');
    const mostrar = input.type === 'password';
    const texto = mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña';
    input.type = mostrar ? 'text' : 'password';
    this.querySelector('i').className = mostrar ? 'bi bi-eye-slash' : 'bi bi-eye';
    this.setAttribute('aria-pressed', mostrar);
    this.setAttribute('aria-label', texto);
    this.title = texto;
  });
</script>
{% endblock %}
